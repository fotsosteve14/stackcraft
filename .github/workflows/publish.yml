name: Publish

# Publishes create-stackcraft to npm when a version tag (v1.2.3) is pushed.
# Authentication uses npm trusted publishing (OIDC): no npm token is stored in the repository.
# The trusted publisher is configured on npmjs.com, in the create-stackcraft package settings.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check that the tag matches the package version
        run: |
          version=$(node -p "require('./packages/create-stackcraft/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match create-stackcraft $version" >&2
            exit 1
          fi
      - run: npm test
      - run: npm run typecheck
      - run: npm run build -w create-stackcraft
      - name: Publish (skipped when this version is already on npm, e.g. the first manual publish)
        run: |
          version=$(node -p "require('./packages/create-stackcraft/package.json').version")
          if npm view "create-stackcraft@$version" version >/dev/null 2>&1; then
            echo "create-stackcraft $version is already published."
          else
            npm publish -w create-stackcraft --access public
          fi
